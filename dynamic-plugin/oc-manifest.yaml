  apiVersion: v1
kind: Namespace
metadata:
  name: genie-plugin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genie-plugin
  namespace: genie-plugin
  labels:
    app: genie-plugin
    app.kubernetes.io/component: genie-plugin
    app.kubernetes.io/instance: genie-plugin
    app.kubernetes.io/part-of: genie-plugin
    app.openshift.io/runtime-namespace: genie-plugin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genie-plugin
  template:
    metadata:
      labels:
        app: genie-plugin
    spec:
      containers:
        - name: genie-plugin
          image: quay.io/jhadvig/genie-plugin
          ports:
            - containerPort: 9001
              protocol: TCP
          imagePullPolicy: Always
          volumeMounts:
            - name: console-serving-cert
              readOnly: true
              mountPath: /var/serving-cert
            - name: nginx-conf
              readOnly: true
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: console-serving-cert
          secret:
            secretName: console-serving-cert
            defaultMode: 420
        - name: nginx-conf
          configMap:
            name: genie-plugin
            defaultMode: 420
      restartPolicy: Always
      dnsPolicy: ClusterFirst
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    service.alpha.openshift.io/serving-cert-secret-name: console-serving-cert
  name: genie-plugin
  namespace: genie-plugin
  labels:
    app: genie-plugin
    app.kubernetes.io/component: genie-plugin
    app.kubernetes.io/instance: genie-plugin
    app.kubernetes.io/part-of: genie-plugin
spec:
  ports:
    - name: 9001-tcp
      protocol: TCP
      port: 9001
      targetPort: 9001
  selector:
    app: genie-plugin
  type: ClusterIP
  sessionAffinity: None
---
apiVersion: console.openshift.io/v1
kind: ConsolePlugin
metadata:
  name: genie-plugin
spec:
  backend:
    service:
      basePath: /
      name: genie-plugin
      namespace: genie-plugin
      port: 9001
    type: Service
  displayName: OpenShift Console Genie Plugin
  i18n:
    loadType: Preload
  proxy:
    - alias: perses
      authorization: UserToken
      endpoint:
        service:
          name: thanos-querier
          namespace: openshift-monitoring
          port: 9090
        type: Service
    - alias: lightspeed
      authorization: UserToken
      endpoint:
        service:
          name: lightspeed-app-server
          namespace: openshift-lightspeed
          port: 8443
        type: Service
    - alias: dashboard-mcp
      authorization: UserToken
      endpoint:
        service:
          name: layout-manager
          namespace: genie-plugin
          port: 9081
        type: Service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: genie-plugin
  namespace: genie-plugin
  labels:
    app: genie-plugin
    app.kubernetes.io/component: genie-plugin
    app.kubernetes.io/instance: genie-plugin
    app.kubernetes.io/part-of: genie-plugin
data:
  nginx.conf: |
    error_log /dev/stdout info;
    events {}
    http {
      access_log         /dev/stdout;
      include            /etc/nginx/mime.types;
      default_type       application/octet-stream;
      keepalive_timeout  65;
      server {
        listen              9001 ssl;
        listen              [::]:9001 ssl;
         ssl_certificate     /var/serving-cert/tls.crt;
         ssl_certificate_key /var/serving-cert/tls.key;
        root                /usr/share/nginx/html;
      }
    }