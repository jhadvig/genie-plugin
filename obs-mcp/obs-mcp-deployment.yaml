apiVersion: apps/v1
kind: Deployment
metadata:
  name: obs-mcp
  labels:
    app: obs-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: obs-mcp
  template:
    metadata:
      labels:
        app: obs-mcp
    spec:
      containers:
      - name: obs-mcp
        imagePullPolicy: Always
        image: docker.io/jhadvig/obs-mcp:latest
        ports:
        - containerPort: 9100
          name: http
        env:
        # Configure Prometheus URL
        - name: PROMETHEUS_URL
          value: "http://thanos-querier.openshift-monitoring.svc.cluster.local:9091"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 9100
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 9100
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: obs-mcp-service
  labels:
    app: obs-mcp
spec:
  selector:
    app: obs-mcp
  ports:
  - name: http
    port: 80
    targetPort: 9100
    protocol: TCP
  type: ClusterIP
